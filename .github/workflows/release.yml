name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Await upstream snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # repo:workflow:branch. Upstream head run must pass before -SNAPSHOT deps resolve; 3 min grace for it to appear.
          for up in GemRender:nightly.yml:main Advanced-Hitbox-Framework:nightly.yml:main; do
            IFS=: read -r repo wf branch <<<"$up"
            head=$(gh api "repos/Warfactory-Official/$repo/commits/$branch" -q .sha)
            status=; conclusion=; sha=; url=
            for i in $(seq 1 160); do
              IFS=$'\t' read -r sha status conclusion url < <(gh run list -R "Warfactory-Official/$repo" -w "$wf" -b "$branch" -L 1 \
                --json headSha,status,conclusion,url -q '.[0] | [.headSha, .status, .conclusion, .url] | @tsv') || true
              if [ "$status" = completed ] && { [ "$sha" = "$head" ] || [ "$i" -gt 12 ]; }; then break; fi
              sleep 15
            done
            [ "$status" = completed ] || { echo "::error::$repo $wf not finished after 40 min: $url"; exit 1; }
            [ "$conclusion" = success ] || { echo "::error::$repo $wf $conclusion at ${sha::7}: $url"; exit 1; }
            echo "$repo $wf ok at ${sha::7}"
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read mod version
        id: version
        run: |
          VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "mod_version not found in gradle.properties" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.check.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Publish WarForge to mavenLocal
        if: steps.check.outputs.exists == 'false'
        run: |
          git clone https://github.com/Warfactory-Official/WarForge-Remaintained.git "$RUNNER_TEMP/warforge"
          git -C "$RUNNER_TEMP/warforge" checkout 1bb799899975d31d97c9c5e2dcbc2638769e144e
          cd "$RUNNER_TEMP/warforge"
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal --no-daemon --stacktrace

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/libs/wflib-${{ steps.version.outputs.version }}.jar
