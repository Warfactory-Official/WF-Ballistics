name: Nightly Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish WarForge to mavenLocal
        run: |
          git clone https://github.com/Warfactory-Official/WarForge-Remaintained.git "$RUNNER_TEMP/warforge"
          git -C "$RUNNER_TEMP/warforge" checkout 1bb799899975d31d97c9c5e2dcbc2638769e144e
          cd "$RUNNER_TEMP/warforge"
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal --no-daemon --stacktrace

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true  # org artifact quota full => still publish
        with:
          name: wflib-nightly-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 14

      - name: Publish snapshot
        env:
          WARFACTORY_MAVEN_USER: ${{ secrets.WARFACTORY_MAVEN_USER }}
          WARFACTORY_MAVEN_TOKEN: ${{ secrets.WARFACTORY_MAVEN_TOKEN }}
        run: ./gradlew publish --no-daemon --stacktrace
