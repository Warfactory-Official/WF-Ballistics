plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // ModDevGradle 2: NeoForge's own single-version build plugin. Replaces ForgeGradle +
    // the SpongePowered MixinGradle plugin (both removed: NeoForge bundles Mixin/MixinExtras and
    // uses MojMap at runtime, so no reobf/refmap step is needed).
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so this mod targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// MC bundles an OpenAL Soft with no PipeWire backend, which garbles audio on most PipeWire systems.
// Prefer the system OpenAL Soft (native PipeWire backend) when installed. No-ops on Windows/macOS or
// when absent, so it is safe for other builds. Wired into the client run below.
def systemOpenAl = [
        '/usr/lib/libopenal.so.1',
        '/usr/lib64/libopenal.so.1',
        '/usr/lib/x86_64-linux-gnu/libopenal.so.1',
        '/usr/local/lib/libopenal.so.1',
].collect { file(it) }.find { it.exists() }
if (systemOpenAl != null) {
    logger.lifecycle "OpenAL: overriding bundled LWJGL native with system ${systemOpenAl}"
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir 'src/generated/resources'
    // NOTE: assets/wfballistics/raw_models/**/*.obj IS referenced at runtime by the neoforge:obj model loader
    // (see the missile model JSONs), so it must ship, so it is NOT excluded here.
    // Dev-only authoring sources that are never loaded:
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'createmod maven' // the new Engine-Room Flywheel
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        // Modrinth's maven, for dev-time optimisation mods we benchmark against. Scoped so it can never
        // shadow a real dependency.
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        // CurseMaven hosts curse.maven:* artifacts (spark). Scoped to the curse.maven group.
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        // JourneyMap's own maven, which is the only place the client API is published. Scoped to
        // info.journeymap; the mod itself comes from Modrinth above.
        name = 'JourneyMap'
        url = 'https://jm.gserv.me/repository/maven-public/'
        content { includeGroup 'info.journeymap' }
    }

    // --- WarForge Factions Remaintained ------------------------------------------------------
    // Its own release maven, then mavenLocal. Both scoped to com.flansmod.warforge so mavenLocal
    // can never shadow a real dependency. repo.warfactory.co is still on 2.1.0 (1.20.1 Forge), so
    // the 1.21.1 build (${warforge_version}) currently comes from mavenLocal (see gradle.properties).
    maven {
        name = 'Warfactory Releases'
        url = 'https://repo.warfactory.co/releases'
        content { includeGroup 'com.flansmod.warforge' }
    }
    mavenLocal { content { includeGroup 'com.flansmod.warforge' } }

    // --- Repos for the compile-only integrations (kept from the Forge build; re-enable with the
    //     corresponding dependencies once their 1.21.1 coordinates are confirmed) ---
    maven { name = 'GTCEu Maven'; url = 'https://maven.gtceu.com'; content { includeGroup 'com.gregtechceu.gtceu' } }
    maven { name = 'FirstDark Maven'; url = 'https://maven.firstdark.dev/snapshots'; content { includeGroupAndSubgroups 'com.lowdragmc' } }
    maven { name = 'tterrag Maven'; url = 'https://maven.tterrag.com/'; content { includeGroup 'com.tterrag.registrate' } }
    maven { name = 'toma Maven'; url = 'https://repo.repsy.io/mvn/toma/public/'; content { includeGroup 'dev.toma.configuration' } }
    maven { name = 'ModMaven'; url = 'https://modmaven.dev' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven { name = 'Latvian'; url = 'https://maven.latvian.dev/releases' }
    maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }

    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access Transformers are auto-detected at src/main/resources/META-INF/accesstransformer.cfg.
    // (None ship today; uncomment to make it explicit if one is added.)
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (systemOpenAl != null) {
                systemProperty 'org.lwjgl.openal.libname', systemOpenAl.absolutePath
            }
            // -PquickPlay=<world> boots straight into a save instead of the main menu. Client-side work
            // (renderers, HUDs, the scope) can only be checked by looking at it, and every menu click
            // between launch and the world is a step an automated check has to get right blind.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            // -PquickJoin=<host:port> connects straight to a server, the multiplayer counterpart of the
            // above. Some behaviour only exists on a server (the recon map overlay treats a singleplayer
            // host as an operator by design, so its permission rule cannot be checked in a single-player
            // world at all), and the menu path to a join is four blind clicks and a typed address.
            if (project.hasProperty('quickJoin')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('quickJoin').toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            // -PwithWarforge runs get their own game directory: WarForge keeps faction/claim state in
            // the save, so a factions run must not share a world with the plain dev run.
            gameDirectory = project.file(project.hasProperty('withWarforge') ? 'run-warforge' : 'run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG

            // -Pjfr makes the run profilable with Java Flight Recorder, without starting a recording:
            // attach one on demand with `jcmd <pid> JFR.start`, so a recording covers the benchmark window
            // rather than ten minutes of startup.
            //
            // DebugNonSafepoints is the flag that makes the profile worth reading. Without it the JIT only
            // emits stack-trace metadata at safepoints, so every sample is attributed to the nearest safepoint
            // rather than to where the time actually went: hot leaf methods vanish and their callers inherit
            // the cost. Left off by default because it slightly constrains optimisation.

            // -Paccel=FFM pins Accelerated Recoiling's collision backend. Explicit rather than AUTO, because
            // AUTO prefers its OpenCL backend and a headless server has no GPU to prefer: benchmarking the
            // GPU path on a dev box reports a number no server can reproduce.
            // -PprobeTrace logs every scroll the probe sees, for diagnosing a modifier that is not arriving.
            if (project.hasProperty('probeTrace')) {
                systemProperty 'wfballistics.probeInputTrace', 'true'
            }

            if (project.hasProperty('accel')) {
                systemProperty 'acceleratedrecoiling.backend', project.property('accel')
            }

            // Gas clouds are raymarched in the dev run. This is the client.gas.volumetric config option,
            // forced from here rather than by writing the toml, because the config file is generated on
            // first launch and a run directory that already has one would silently keep the old value.
            // -PvolumetricGas=false turns it back off for an A/B against the billboard path;
            // -PvolumetricGasQuality=LOW|MEDIUM|HIGH picks the step count.
            systemProperty 'wfballistics.volumetricGas',
                    project.hasProperty('volumetricGas') ? project.property('volumetricGas').toString() : 'true'
            if (project.hasProperty('volumetricGasQuality')) {
                systemProperty 'wfballistics.volumetricGasQuality',
                        project.property('volumetricGasQuality').toString()
            }
            if (project.hasProperty('jfr')) {
                // stackdepth is 64 by default and JFR truncates the *outermost* frames, which are the ones a
                // sample has to be attributed by: an entity tick under mixins is well past 64 frames deep, so
                // at the default every sample inside the pathfinder arrives with `Entity.tick` already cut off
                // and cannot be charged to a phase.
                jvmArguments.addAll '-XX:+UnlockDiagnosticVMOptions', '-XX:+DebugNonSafepoints',
                        '-XX:FlightRecorderOptions=stackdepth=192',
                        '-XX:StartFlightRecording:name=idle,settings=none'
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// 'localRuntime' is present for dev-time testing but is NOT published as a dependency of this mod.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // --- Benchmarking company ----------------------------------------------------------------
    // Lithium is dev-runtime only and never published. It is here so the swarm work is measured in
    // the environment it will actually ship into, and (more pointedly), so that anywhere we patch
    // vanilla for performance, we find out immediately whether Lithium already patched it or, worse,
    // patched it a different way. Vanilla's PathTypeCache is exactly that kind of contested ground.
    localRuntime "maven.modrinth:lithium:${lithium_version}"

    // Sodium, behind -PwithSodium, because it is an A/B and not a baseline. The drone camera renders the
    // world a second time from a second camera, which is exactly the thing a rewritten chunk renderer is
    // entitled to break, and Sodium keeps its own per-camera state (SodiumWorldRenderer.lastCameraPos,
    // RenderSectionManager.needsGraphUpdate) that alternating cameras fight over. There is no compileOnly
    // counterpart on purpose: everything we touch of Sodium's goes through reflection in SodiumChunkProbe,
    // so the mod builds and runs identically whether or not Sodium is installed.
    //     ./gradlew runClient -PwithSodium
    if (project.hasProperty('withSodium')) {
        localRuntime "maven.modrinth:sodium:${sodium_version}"
    }

    // --- GemRender (skinned/rigged models on Flywheel) ---------------------------------------
    // Every animated entity draws through it: drones, missiles and both tiers of the glyphid swarm are
    // one instance each posed from a shared bone palette, instead of one instance per moving part.
    // A local jar because GemRender is not published anywhere yet; declared required in the toml, so
    // it is not jar-in-jar'd either.
    compileOnly files('libs/gemrender-1.21.1-0.1.0.jar')
    // Client runs only, for the same reason as JourneyMap below: GemRender jar-in-jars lwjgl-ktx for its
    // KTX2 textures, and that module requires org.lwjgl, which a dedicated server does not have on its
    // module path. FML dies building the transforming module layer before any mod is constructed. The
    // dependency is declared side = "CLIENT" in neoforge.mods.toml, so the server never wanted it: the
    // server does not build a rig.
    if (!gradle.startParameter.taskNames.any { it.toLowerCase().contains('server') }) {
        localRuntime files('libs/gemrender-1.21.1-0.1.0.jar')
    }

    // --- Flywheel (Engine-Room, NeoForge 1.21.1) ---------------------------------------------
    // Flywheel is declared a required dependency in neoforge.mods.toml, so it is NOT jar-in-jar'd
    // (ships separately, avoids clashing with the copy Create bundles).
    //
    // The FULL jar rather than flywheel-neoforge-api, matching what GemRender compiles against:
    // GemRenderInstance extends ColoredLitInstance, which lives in flywheel-lib and not in the API.
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${flywheel_version}"
    localRuntime "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${flywheel_version}"

    // --- spark profiler (runtime-only) -------------------------------------------------------
    // TODO(port): find the spark file id for NeoForge 1.21.1 on CurseForge, then:
    // localRuntime "curse.maven:spark-361579:<neo_1.21.1_file_id>"

    // --- GregTechCEu Modern (compile-only optional integration): NeoForge 1.21.1 build via CurseMaven.
    //     compileOnly (NOT implementation): the EMP-warhead integration compiles against GregTech but GregTech
    //     is only loaded at runtime if the user installs it. transitive=false to avoid dragging GregTech's
    //     whole dependency tree (AE2/LDLib/JEI/KubeJS) onto the classpath.
    compileOnly("curse.maven:gregtechceu-modern-890405:6766269") { transitive = false }

    // LDLib: GregTech's UI/syncdata library. Needed at COMPILE time because GregTech's public types
    // (IMaintenanceMachine, MetaMachine, NotifiableEnergyContainer) extend LDLib interfaces (IUIHolder,
    // IEnhancedManaged). compileOnly + transitive=false, same rationale as GregTech.
    // Pinned to 1.0.35.a: the exact version GregTech 7.0.1 (file 6766269) was built against.
    // Newer LDLib (1.0.41) dropped IEnhancedManaged, which GregTech's MetaMachine still implements.
    compileOnly("com.lowdragmc.ldlib:ldlib-neoforge-1.21.1:1.0.35.a") { transitive = false }
    runtimeOnly("curse.maven:spark-361579:6225208")

    // --- JourneyMap (compile-only API, dev-runtime mod) ---------------------------------------
    // The recon grid overlay draws through JourneyMap's client API. compileOnly + never shaded, same
    // rationale as GregTech: the plugin class is only ever classloaded by JourneyMap's own annotation
    // scan, so the mod builds and runs identically with JourneyMap absent.
    //
    // The API is published only as a live SNAPSHOT, so the version is pinned to a timestamped build
    // rather than to -SNAPSHOT: the latter would silently change what this compiles against between
    // one build and the next, and the 2.0 API is still moving.
    compileOnly "info.journeymap:journeymap-api-neoforge:${journeymap_api_version}"

    // The mod itself, dev-runtime only and never published; there is nothing to draw on without it.
    // Not behind a -P flag (unlike Sodium) because this one is the feature under test rather than an
    // A/B: a dev client with no minimap cannot show whether the overlay works.
    //
    // Client runs only, and not by preference: JourneyMap jar-in-jars lwjgl-ktx, whose module descriptor
    // requires org.lwjgl. A dedicated server has no lwjgl on its module path, so FML fails to build the
    // transforming module layer ("Module org.lwjgl not found, required by org.lwjgl.ktx") before any
    // mod is constructed and runServer dies in about a second. Keyed off the task name rather than a
    // property so that `./gradlew runServer` simply works; a minimap is client-side anyway, so nothing
    // server-side loses a dependency it was using.
    if (!gradle.startParameter.taskNames.any { it.toLowerCase().contains('server') }) {
        localRuntime "maven.modrinth:journeymap:${journeymap_version}"
    }

    // --- WarForge Factions Remaintained (compile-only optional integration) -------------------
    //     Backs compat/warforge/WarforgeApi: faction friend-or-foe and claim-aware explosions.
    //     compileOnly + transitive=false, same rationale as GregTech: WarForge is only present at
    //     runtime if the user installs it, and its LDLib2 dependency has no business on our
    //     compile classpath.
    compileOnly("com.flansmod.warforge:warforge-remaintained:${warforge_version}") { transitive = false }

    // Dev-only: `-PwithWarforge` puts WarForge and its LDLib2 runtime dependency into the dev run
    // classpath so the integration can actually be exercised in-game. Off by default, since a dev
    // run without it is the "WarForge absent" path the compat layer also has to handle.
    if (project.hasProperty('withWarforge')) {
        localRuntime("com.flansmod.warforge:warforge-remaintained:${warforge_version}") { transitive = false }
        localRuntime "com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all"
    }

    // --- Other compile-only integrations (disabled until their 1.21.1 coordinates are confirmed) ---
    // TODO(port): Registrate 1.21.1
    // compileOnly("com.tterrag.registrate:Registrate:MC1.21.1-<ver>") { transitive = false }

    // --- Mixin ------------------------------------------------------------------------------
    // NeoForge bundles Mixin (0.8.x) + MixinExtras and puts them on the compile classpath via the
    // neoForge dependency, so no explicit dependency or annotation processor is required. If the
    // mixin phase hits "cannot find symbol" for org.spongepowered.asm.* add a compileOnly here.
}

// Expand ${...} tokens in src/main/templates (notably META-INF/neoforge.mods.toml) and feed the
// result into the main source set. Mirrors the official MDK's generateModMetadata task.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            flywheel_version_range : flywheel_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
