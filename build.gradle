plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // ModDevGradle 2 — NeoForge's own single-version build plugin. Replaces ForgeGradle +
    // the SpongePowered MixinGradle plugin (both removed: NeoForge bundles Mixin/MixinExtras and
    // uses MojMap at runtime, so no reobf/refmap step is needed).
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so this mod targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// MC bundles an OpenAL Soft with no PipeWire backend, which garbles audio on most PipeWire systems.
// Prefer the system OpenAL Soft (native PipeWire backend) when installed. No-ops on Windows/macOS or
// when absent, so it is safe for other builds. Wired into the client run below.
def systemOpenAl = [
        '/usr/lib/libopenal.so.1',
        '/usr/lib64/libopenal.so.1',
        '/usr/lib/x86_64-linux-gnu/libopenal.so.1',
        '/usr/local/lib/libopenal.so.1',
].collect { file(it) }.find { it.exists() }
if (systemOpenAl != null) {
    logger.lifecycle "OpenAL: overriding bundled LWJGL native with system ${systemOpenAl}"
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir 'src/generated/resources'
    // NOTE: assets/wfballistics/raw_models/**/*.obj IS referenced at runtime by the neoforge:obj model loader
    // (see the missile model JSONs) — it must ship, so it is NOT excluded here.
    // Dev-only authoring sources that are never loaded:
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

sourceSets.main.java {
    // TODO(port): WarForge Factions integration excluded until its NeoForge 1.21.1 coordinate is confirmed.
    // WarforgeCompat is stubbed so the rest of the mod builds. Un-exclude when WarForge is on the classpath.
    exclude 'com/wf/wfballistics/compat/warforge/**'
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'createmod maven' // the new Engine-Room Flywheel
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        // CurseMaven — hosts curse.maven:* artifacts (spark, WarForge). Scoped to the curse.maven group.
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }

    // --- Repos for the compile-only integrations (kept from the Forge build; re-enable with the
    //     corresponding dependencies once their 1.21.1 coordinates are confirmed) ---
    maven { name = 'GTCEu Maven'; url = 'https://maven.gtceu.com'; content { includeGroup 'com.gregtechceu.gtceu' } }
    maven { name = 'FirstDark Maven'; url = 'https://maven.firstdark.dev/snapshots'; content { includeGroupAndSubgroups 'com.lowdragmc' } }
    maven { name = 'tterrag Maven'; url = 'https://maven.tterrag.com/'; content { includeGroup 'com.tterrag.registrate' } }
    maven { name = 'toma Maven'; url = 'https://repo.repsy.io/mvn/toma/public/'; content { includeGroup 'dev.toma.configuration' } }
    maven { name = 'ModMaven'; url = 'https://modmaven.dev' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven { name = 'Latvian'; url = 'https://maven.latvian.dev/releases' }
    maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }

    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access Transformers are auto-detected at src/main/resources/META-INF/accesstransformer.cfg.
    // (None ship today; uncomment to make it explicit if one is added.)
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (systemOpenAl != null) {
                systemProperty 'org.lwjgl.openal.libname', systemOpenAl.absolutePath
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// 'localRuntime' is present for dev-time testing but is NOT published as a dependency of this mod.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // --- Flywheel (Engine-Room, NeoForge 1.21.1) ---------------------------------------------
    // compileOnly API for types at compile time; the full jar is present in dev via localRuntime.
    // Flywheel is declared a required dependency in neoforge.mods.toml, so it is NOT jar-in-jar'd
    // (ships separately, avoids clashing with the copy Create bundles).
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:${flywheel_version}"
    localRuntime "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${flywheel_version}"

    // --- spark profiler (runtime-only) -------------------------------------------------------
    // TODO(port): find the spark file id for NeoForge 1.21.1 on CurseForge, then:
    // localRuntime "curse.maven:spark-361579:<neo_1.21.1_file_id>"

    // --- GregTechCEu Modern (compile-only optional integration) — NeoForge 1.21.1 build via CurseMaven.
    //     compileOnly (NOT implementation): the EMP-warhead integration compiles against GregTech but GregTech
    //     is only loaded at runtime if the user installs it. transitive=false to avoid dragging GregTech's
    //     whole dependency tree (AE2/LDLib/JEI/KubeJS) onto the classpath.
    compileOnly("curse.maven:gregtechceu-modern-890405:6766269") { transitive = false }

    // LDLib — GregTech's UI/syncdata library. Needed at COMPILE time because GregTech's public types
    // (IMaintenanceMachine, MetaMachine, NotifiableEnergyContainer) extend LDLib interfaces (IUIHolder,
    // IEnhancedManaged). compileOnly + transitive=false, same rationale as GregTech.
    // Pinned to 1.0.35.a — the exact version GregTech 7.0.1 (file 6766269) was built against.
    // Newer LDLib (1.0.41) dropped IEnhancedManaged, which GregTech's MetaMachine still implements.
    compileOnly("com.lowdragmc.ldlib:ldlib-neoforge-1.21.1:1.0.35.a") { transitive = false }

    // --- Other compile-only integrations (disabled until their 1.21.1 coordinates are confirmed) ---
    // TODO(port): Registrate 1.21.1
    // compileOnly("com.tterrag.registrate:Registrate:MC1.21.1-<ver>") { transitive = false }
    // TODO(port): WarForge Factions — confirm the NeoForge 1.21.1 project/file id on CurseForge
    // compileOnly "curse.maven:warforge-factions-remaintained-1340172:<neo_1.21.1_file_id>"

    // --- Mixin ------------------------------------------------------------------------------
    // NeoForge bundles Mixin (0.8.x) + MixinExtras and puts them on the compile classpath via the
    // neoForge dependency, so no explicit dependency or annotation processor is required. If the
    // mixin phase hits "cannot find symbol" for org.spongepowered.asm.* add a compileOnly here.
}

// Expand ${...} tokens in src/main/templates (notably META-INF/neoforge.mods.toml) and feed the
// result into the main source set. Mirrors the official MDK's generateModMetadata task.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            flywheel_version_range : flywheel_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
