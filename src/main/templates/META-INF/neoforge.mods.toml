# WFLib: NeoForge mod metadata.
# The dollar-brace tokens below are expanded by the generateModMetadata task in build.gradle from gradle.properties.
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Warfactory-Official/WF-Ballistics/issues"

[[mods]]
modId = "wflib"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Mixin configs are declared to FML here on NeoForge (no MANIFEST MixinConfigs attribute).
[[mixins]]
config = "wflib.mixins.json"

# --- Required: NeoForge ---
[[dependencies.wflib]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

# --- Required: Minecraft ---
[[dependencies.wflib]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# --- Required: Flywheel (instanced rendering) ---
[[dependencies.wflib]]
modId = "flywheel"
type = "required"
versionRange = "${flywheel_version_range}"
ordering = "AFTER"
side = "CLIENT"

# --- Required: GemRender (rigged models on Flywheel) ---
# Every animated entity is drawn through it. Client only: the server never builds a rig.
[[dependencies.wflib]]
modId = "gemrender"
type = "required"
versionRange = "${gemrender_version_range}"
ordering = "AFTER"
side = "CLIENT"

# --- Required: AHF (hit parts + lag-comp history for rounds) ---
[[dependencies.wflib]]
modId = "ahf"
type = "required"
versionRange = "${ahf_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional integration: when Superb Warfare is present, WF missiles are folded into its
# superbwarfare:destroyable_projectile tag so its missiles, anti-air and radar can lock onto them.
[[dependencies.wflib]]
modId = "superbwarfare"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Optional integration: the EMP warhead drains and disables GregTech machines.
[[dependencies.wflib]]
modId = "gtceu"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Optional integration: Immersive Railroading. Everything under com.wf.wflib.rail is inert without it -
# no config file, no ticking, no registration. Ordered AFTER so IR's own registries exist first.
[[dependencies.wflib]]
modId = "immersiverailroading"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Optional integration: WarForge faction friend-or-foe + claim-aware explosions.
[[dependencies.wflib]]
modId = "warforge"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
