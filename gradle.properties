# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# NeoForm setup (Minecraft decompile/recompile) is memory-hungry; keep this generous.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is left OFF during the port: it hides which task invalidated the build and
# interacts awkwardly with the custom generateModMetadata / OpenAL-native logic. Re-enable once stable.
org.gradle.configuration-cache=false


## Environment Properties

# Parchment parameter-name mappings layered on official MojMap.
# Latest: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The Minecraft version must agree with the NeoForge version to get a valid artifact.
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1,1.22)
# NeoForge 21.1.x targets Minecraft 1.21.1. Latest stable as of 2026-08: 21.1.248
# (MDK ships 21.1.244). See https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.248
# Dependency version range declared in neoforge.mods.toml (kept loose for compatibility).
neo_version_range=[21.1.1,22)
# The loader version range can only use the major version of FML as bounds. NeoForge FML major = 1.
loader_version_range=[1,)


## Dependency Properties

# Flywheel: the new Engine-Room Flywheel, NeoForge 1.21.1 variant (maven.createmod.net).
# 1.0.6 is the tagged release; 1.0.6-44 is the latest CI build.
flywheel_version=1.0.6
flywheel_version_range=[1.0,2.0)

# WarForge Factions Remaintained: the NeoForge 1.21.1 port (com.flansmod.warforge). Compile-only
# optional integration. The public maven (repo.warfactory.co) still only carries the 1.20.1-era
# 2.1.0, so until 2.4.x is published there this resolves from mavenLocal; build it with
# `./gradlew publishToMavenLocal` in the sibling WarForge-Remaintained checkout.
warforge_version=2.4.3
# LDLib2 is WarForge's own runtime dependency; only needed for -PwithWarforge dev runs.
ldlib2_version=2.2.26


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=wflib
# The human-readable display name for the mod.
mod_name=WFLib
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GPL-3
# The mod version. See https://semver.org/
mod_version=1.2.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
mod_group_id=com.wf.wflib
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=MrNorwood, IGoByLotsOfNames, Glowker, SilentYeti
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=A guided-missile and area-effect explosion library: server-simulated missiles with phased flight, warheads, and active interception, plus a pluggable explosion framework and instanced rendering.

# JourneyMap: the client API (compile-only) and the mod (dev runtime only).
#
# The API only exists as a rolling SNAPSHOT on jm.gserv.me, so this is the timestamped build number
# rather than 2.0.0-1.21.1-SNAPSHOT: pinned deliberately, because the 2.0 API is still changing and
# a floating snapshot would move what the plugin compiles against without anything in the repo saying
# so. Build 31 is 2026-05-29. Note the package is journeymap.api.v2.*, not the journeymap.client.api
# every published tutorial still shows; those types do not exist in 2.0.
journeymap_api_version=2.0.0-1.21.1-20260529.024614-31
journeymap_version=1.21.1-6.0.6+neoforge

# Dev-runtime only: benchmarking company, never published. See dependencies in build.gradle.
lithium_version=mc1.21.1-0.15.4-neoforge

# Dev-runtime only, and only with -PwithSodium. See the dependencies block in build.gradle.
sodium_version=mc1.21.1-0.8.13-neoforge
